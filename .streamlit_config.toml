[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
runOnSave = true
port = 8501
enableCORS = false
maxUploadSize = 200

[logger]
level = "info"

[client]
showErrorDetails = true

[browser]
gatherUsageStats = false
